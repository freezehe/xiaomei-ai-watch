# 放到：/usr/local/nginx/conf/conf.d/xiaozhi.conf
# 并在 /usr/local/nginx/conf/nginx.conf 的 http { } 里加一行：include conf.d/*.conf;
#
# 公网唯一入口：8888 端口
#   OTA:       http://<你的服务器IP>:8888/__SECRET__/xiaozhi/ota/   隐藏路径，只有你知道
#   WebSocket: ws://<你的服务器IP>:8888/xiaozhi/v1/                必须带 OTA 下发的 token
# __SECRET__ 由 init_secrets.sh 自动替换成随机串

map $http_upgrade $xiaozhi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    server_name _;
    access_log /var/log/xiaozhi-nginx/access.log;
    error_log  /var/log/xiaozhi-nginx/error.log warn;

    # 隐藏路径的 OTA：服务端会给任何调用 OTA 的设备发 token，所以 OTA 路径本身必须保密
    location = /__SECRET__/xiaozhi/ota/ {
        proxy_pass http://127.0.0.1:8003/xiaozhi/ota/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }

    # WebSocket 语音通道（服务端 auth 开启后校验 token）
    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xiaozhi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其他路径（包括不带 SECRET 的 /xiaozhi/ota/）一律 404
    location / {
        return 404;
    }
}
